<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TestAnalyzer IA</title>
    <link rel="stylesheet" href="../inicio de sesion/estilo.css">
</head>
<body>
    <div class="container">
        <div class="container-form">
            <form class="inicio-sesion">
                <a href="../Pagina principal/Principal.html"><h2>Iniciar Sesión</h2></a>
                <div class="redes-sociales">
                    <ion-icon name="logo-x"></ion-icon>
                    <ion-icon name="logo-facebook"></ion-icon>
                    <ion-icon name="logo-instagram"></ion-icon>
                    <ion-icon name="logo-tiktok"></ion-icon>
                </div>
                <span>Use su correo y contraseña</span>
                <div class="container-input">
                    <ion-icon name="mail-unread-outline"></ion-icon>
                    <input type="email" placeholder="Email" autocomplete="email" required>
                </div>
                <div class="container-input">
                    <ion-icon name="lock-closed-outline"></ion-icon>
                    <input type="password" placeholder="Contraseña" autocomplete="current-password" required>
                </div>
                <a href="#">¿Olvidaste tu contraseña?</a><br>
                <button class="button" type="submit">INICIAR SESIÓN</button>
            </form>
        </div>
        <div class="container-form">
            <form class="registro">
                <h2>Registrarse</h2>
                <div class="redes-sociales">
                    <ion-icon name="logo-x"></ion-icon>
                    <ion-icon name="logo-facebook"></ion-icon>
                    <ion-icon name="logo-instagram"></ion-icon>
                    <ion-icon name="logo-tiktok"></ion-icon>
                </div>
                <span>Use su correo Electrónico para registrarse</span>
                <div class="container-input">
                    <ion-icon name="person-outline"></ion-icon>
                    <input type="text" placeholder="Nombre" autocomplete="name" required>
                </div>
                <div class="container-input">
                    <ion-icon name="mail-unread-outline"></ion-icon>
                    <input type="email" placeholder="Email" autocomplete="email" required>
                </div>
                <div class="container-input">
                    <ion-icon name="lock-closed-outline"></ion-icon>
                    <input type="password" placeholder="Contraseña" autocomplete="new-password" required>
                </div>
                <button class="button" type="submit">REGISTRARSE</button>
            </form>
        </div>
        <div class="container-welcome">
            <div class="wecome-sign-up welcome">
                <h3>Bienvenido</h3>
                <p>Ingrese sus datos personales para Iniciar</p>
                <button class="button" id="btn-sign-up">Registrarse</button>
            </div>
            <div class="wecome-sign-in welcome">
                <h3>Hey</h3>
                <p>Registre sus datos personales</p>
                <button class="button" id="btn-sign-in">Iniciar Sesión</button>
            </div>

        </div>
    </div>


    <script type="module" src="../Inicio de sesion/script.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
</body>
</html>
